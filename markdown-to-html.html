<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to HTML Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .toolbar {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .toolbar button {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .toolbar button:hover { background: rgba(255,255,255,0.25); }
    .container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
    }
    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid #ddd;
    }
    .panel:last-child { border-right: none; }
    .panel-header {
      background: #fff;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-header .tab {
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .panel-header .tab.active {
      background: #e8eaed;
      color: #1a1a2e;
    }
    .panel-header .tab:not(.active):hover { background: #f5f5f5; }
    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 14px;
      line-height: 1.6;
      background: #fafafa;
      tab-size: 2;
    }
    #preview {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fff;
      line-height: 1.7;
      font-size: 15px;
    }
    #htmlOutput {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    /* TOC styles */
    #toc {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fff;
      display: none;
    }
    #toc ul {
      list-style: none;
      padding-left: 0;
    }
    #toc ul ul { padding-left: 20px; }
    #toc li { padding: 4px 0; }
    #toc a {
      color: #0066cc;
      text-decoration: none;
      font-size: 14px;
    }
    #toc a:hover { text-decoration: underline; }
    #toc .toc-empty {
      color: #999;
      font-style: italic;
      font-size: 14px;
    }
    /* Rendered markdown styles */
    #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
      margin-top: 24px;
      margin-bottom: 8px;
      color: #1a1a2e;
    }
    #preview h1 { font-size: 28px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    #preview h2 { font-size: 22px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    #preview h3 { font-size: 18px; }
    #preview p { margin: 12px 0; }
    #preview code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.9em;
    }
    #preview pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
    }
    #preview pre code {
      background: none;
      padding: 0;
      color: inherit;
    }
    #preview blockquote {
      border-left: 4px solid #ddd;
      margin: 12px 0;
      padding: 8px 16px;
      color: #666;
      background: #f9f9f9;
    }
    #preview table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
    }
    #preview th, #preview td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }
    #preview th { background: #f5f5f5; font-weight: 600; }
    #preview img { max-width: 100%; border-radius: 4px; }
    #preview ul, #preview ol { padding-left: 24px; margin: 12px 0; }
    #preview li { margin: 4px 0; }
    #preview hr { border: none; border-top: 2px solid #eee; margin: 24px 0; }
    #preview a { color: #0066cc; }
    /* Copy toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <span style="font-size:22px">📝</span>
    <h1>Markdown to HTML</h1>
    <div class="toolbar">
      <button onclick="copyHTML()">📋 Copy HTML</button>
      <button onclick="clearAll()">🗑️ Clear</button>
    </div>
  </header>

  <div class="container">
    <!-- Editor panel -->
    <div class="panel">
      <div class="panel-header">Markdown Input</div>
      <textarea id="editor" spellcheck="false" placeholder="Type or paste Markdown here..."></textarea>
    </div>

    <!-- Output panel -->
    <div class="panel">
      <div class="panel-header">
        <span class="tab active" data-view="preview" onclick="switchView('preview')">Preview</span>
        <span class="tab" data-view="toc" onclick="switchView('toc')">Table of Contents</span>
        <span class="tab" data-view="html" onclick="switchView('html')">HTML Source</span>
      </div>
      <div id="preview"></div>
      <div id="toc"></div>
      <div id="htmlOutput"></div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const htmlOutput = document.getElementById('htmlOutput');
    const toc = document.getElementById('toc');
    const toast = document.getElementById('toast');

    let currentView = 'preview';
    let headings = [];

    // Custom renderer to capture headings and add IDs
    const renderer = new marked.Renderer();
    const originalHeading = renderer.heading.bind(renderer);
    renderer.heading = function (text, level) {
      const plainText = text.replace(/<[^>]*>/g, '');
      const slug = plainText.toLowerCase().replace(/[^\w]+/g, '-').replace(/(^-|-$)/g, '');
      headings.push({ text: plainText, depth: level, slug });
      return `<h${level} id="${slug}">${text}</h${level}>`;
    };

    marked.setOptions({
      renderer,
      breaks: true,
      gfm: true
    });

    function render() {
      headings = [];
      const md = editor.value;
      const html = marked.parse(md);

      preview.innerHTML = html;
      htmlOutput.textContent = html;
      buildTOC();
    }

    function buildTOC() {
      if (headings.length === 0) {
        toc.innerHTML = '<p class="toc-empty">No headings found. Add headings in your Markdown (e.g. # Title) to generate a table of contents.</p>';
        return;
      }

      let html = '<ul>';
      let prevDepth = headings[0].depth;

      headings.forEach((h, i) => {
        if (h.depth > prevDepth) {
          html += '<ul>'.repeat(h.depth - prevDepth);
        } else if (h.depth < prevDepth) {
          html += '</ul>'.repeat(prevDepth - h.depth);
        }
        html += `<li><a href="#${h.slug}" onclick="switchView('preview')">${h.text}</a></li>`;
        prevDepth = h.depth;
      });

      html += '</ul>'.repeat(prevDepth - headings[0].depth + 1);
      toc.innerHTML = html;
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
      preview.style.display = view === 'preview' ? 'block' : 'none';
      toc.style.display = view === 'toc' ? 'block' : 'none';
      htmlOutput.style.display = view === 'html' ? 'block' : 'none';
    }

    function copyHTML() {
      const html = marked.parse(editor.value);
      navigator.clipboard.writeText(html).then(() => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }).catch(() => {
        // Fallback for environments without clipboard API
        const textarea = document.createElement('textarea');
        textarea.value = html;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    function clearAll() {
      editor.value = '';
      render();
    }

    // Handle tab key in editor
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        render();
      }
    });

    editor.addEventListener('input', render);

    // Load sample content
    editor.value = `# Markdown to HTML Converter

## Features

- **Live preview** as you type
- Auto-generated **Table of Contents**
- Copy raw **HTML output**

## Getting Started

Just start typing Markdown in the left panel!

### Supported Syntax

| Feature | Syntax |
|---------|--------|
| Bold | \`**text**\` |
| Italic | \`*text*\` |
| Link | \`[text](url)\` |
| Image | \`![alt](url)\` |
| Code | \`\\\`code\\\`\` |

### Code Blocks

\`\`\`javascript
function hello() {
  console.log("Hello, Markdown!");
}
\`\`\`

> 💡 **Tip:** Switch to the **HTML Source** tab to see the generated HTML.
`;
    render();
  </script>
</body>
</html>
