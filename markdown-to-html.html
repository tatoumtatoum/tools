<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Markdown to HTML Converter</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }
    header h1 { font-size: 17px; font-weight: 600; white-space: nowrap; }
    .mode-select select {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .mode-select select option { color: #333; background: #fff; }
    .toolbar { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
    .toolbar button, .toolbar .btn {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .toolbar button:hover { background: rgba(255,255,255,0.3); }
    .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
    .toolbar .btn-label { display: inline; }

    /* Mobile view toggle */
    .mobile-tabs {
      display: none;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }
    .mobile-tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .mobile-tab.active { color: #1a1a2e; border-bottom-color: #1a1a2e; }

    /* Container */
    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* Panels */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .editor-panel { border-right: 1px solid #ddd; }
    .panel-header {
      background: #fff;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      min-height: 36px;
    }
    .panel-header .tab {
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }
    .panel-header .tab.active { background: #e8eaed; color: #1a1a2e; }
    .panel-header .tab:not(.active):hover { background: #f5f5f5; }
    .panel-actions { margin-left: auto; display: flex; gap: 4px; }
    .panel-actions button {
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 13px;
      color: #555;
      transition: all 0.2s;
    }
    .panel-actions button:hover { background: #f0f0f0; border-color: #bbb; }
    .status {
      margin-left: auto;
      font-size: 12px;
      font-weight: 400;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Linked-file chip */
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 45%;
      background: #eef2ff;
      color: #3a3a6e;
      border: 1px solid #d6ddff;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
    }
    .file-chip .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-chip .file-watch { flex-shrink: 0; }
    .file-chip .file-readonly { flex-shrink: 0; }
    .file-chip .file-reload,
    .file-chip .file-unlink {
      flex-shrink: 0;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 6px;
      color: #3a3a6e;
    }
    .file-chip .file-reload { color: #b54708; font-weight: 600; }
    .file-chip .file-reload:hover { background: #ffe7c2; }
    .file-chip .file-unlink:hover { background: #d6ddff; }

    /* Drop overlay */
    .drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,26,46,0.55);
      z-index: 150;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .drop-overlay.active { display: flex; }
    .drop-overlay .drop-msg {
      border: 3px dashed #fff;
      border-radius: 16px;
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      padding: 48px 64px;
      text-align: center;
      max-width: 90%;
      pointer-events: none;
    }

    /* Editor */
    textarea#editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.6;
      background: #fafafa;
      tab-size: 2;
      width: 100%;
      min-height: 0;
    }

    /* Panel content areas */
    .panel-content {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    #preview {
      padding: 24px;
      background: #fff;
    }
    #preview.markdown-body { font-size: 15px; }
    #htmlOutput {
      padding: 16px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* TOC */
    #toc { padding: 16px; background: #fff; }
    #toc h3 { font-size: 15px; margin-bottom: 12px; color: #1a1a2e; }
    #toc ul { list-style: none; padding-left: 0; }
    #toc ul ul { padding-left: 20px; }
    #toc li { padding: 3px 0; }
    #toc a { color: #0066cc; text-decoration: none; font-size: 14px; }
    #toc a:hover { text-decoration: underline; }
    .toc-empty { color: #999; font-style: italic; font-size: 14px; }

    /* Settings Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
    }
    .modal-header h2 { font-size: 18px; color: #1a1a2e; }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
      padding: 4px 8px;
      border-radius: 4px;
      line-height: 1;
    }
    .close-btn:hover { background: #f0f0f0; color: #333; }
    .modal-body { padding: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group > label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #333; }
    .help-text { font-size: 12px; color: #888; margin-bottom: 8px; }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      font-size: 14px;
      padding: 6px 0;
      cursor: pointer;
    }
    .checkbox input { width: 18px; height: 18px; cursor: pointer; }
    .rate-limit {
      background: #f8f9fa;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      color: #666;
    }
    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-primary {
      background: #1a1a2e;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary:hover { background: #2a2a4e; }

    /* Reader Mode */
    .reader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 50;
      flex-direction: column;
    }
    .reader-overlay.active { display: flex; }
    .reader-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
      background: #fafafa;
    }
    .reader-header h3 { font-size: 15px; color: #555; }
    .reader-close {
      background: none;
      border: 1px solid #ddd;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: #555;
    }
    .reader-close:hover { background: #f0f0f0; }
    .reader-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .reader-toc {
      width: 260px;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #eee;
      background: #fafafa;
      flex-shrink: 0;
    }
    .reader-toc h4 { font-size: 13px; text-transform: uppercase; color: #999; letter-spacing: 0.5px; margin-bottom: 12px; }
    .reader-toc ul { list-style: none; padding: 0; }
    .reader-toc li { padding: 4px 0; }
    .reader-toc li.toc-h3 { padding-left: 16px; }
    .reader-toc li.toc-h4 { padding-left: 32px; }
    .reader-toc li.toc-h5,
    .reader-toc li.toc-h6 { padding-left: 48px; }
    .reader-toc a { color: #555; text-decoration: none; font-size: 13px; }
    .reader-toc a:hover { color: #0066cc; }
    .reader-body {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
    }
    .reader-body.markdown-body {
      max-width: none;
      font-size: 16px;
      line-height: 1.8;
    }
    .reader-toc {
      transition: width 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
    }
    .reader-toc.collapsed {
      width: 0;
      padding: 0;
      opacity: 0;
      border-right: none;
      overflow: hidden;
    }
    .reader-toc-toggle {
      background: none;
      border: 1px solid #ddd;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #333;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Placeholder state */
    .placeholder-msg {
      color: #999;
      font-style: italic;
      padding: 40px;
      text-align: center;
      font-size: 15px;
    }

    /* Mobile */
    @media (max-width: 768px) {
      header { padding: 10px 12px; gap: 6px; }
      header h1 { font-size: 15px; }
      .mode-select select { padding: 8px 10px; font-size: 14px; }
      .toolbar button { padding: 10px 12px; font-size: 14px; min-height: 44px; }
      .toolbar .btn-label { display: none; }

      .mobile-tabs { display: flex; }
      .container { flex-direction: column; }
      .editor-panel { border-right: none; }
      .panel.mobile-hidden { display: none !important; }

      textarea#editor {
        font-size: 16px; /* prevents iOS zoom */
        padding: 14px;
      }

      .panel-header { padding: 8px 12px; }
      .panel-header .tab { padding: 8px 12px; font-size: 14px; min-height: 40px; display: flex; align-items: center; }
      .panel-actions button { padding: 8px 12px; min-height: 40px; font-size: 14px; }

      #preview { padding: 16px; }

      .drop-overlay .drop-msg { font-size: 17px; padding: 32px 28px; }
      .file-chip { max-width: 55%; font-size: 11px; }

      /* Reader mode mobile */
      .reader-toc { display: none; }
      .reader-toc.show { display: block; position: fixed; inset: 0; z-index: 60; width: 100%; }
      .reader-toc-toggle { display: inline-block; }
      .reader-body { padding: 20px; }
      .reader-body.markdown-body { font-size: 15px; }
    }
    @media (max-width: 400px) {
      header h1 { display: none; }
    }
  </style>
</head>
<body>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>⚙️ Cleanup Options</h2>
      <button onclick="closeSettings()" class="close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>HTML Cleanup</label>
        <p class="help-text">Remove GitHub-specific formatting artifacts from the output HTML</p>
        <label class="checkbox"><input type="checkbox" id="cleanupAnchors" checked> Remove anchor links from headings</label>
        <label class="checkbox"><input type="checkbox" id="cleanupPrefixes" checked> Remove <code>user-content-</code> ID prefixes</label>
        <label class="checkbox"><input type="checkbox" id="cleanupDataAttrs" checked> Strip <code>data-*</code> attributes</label>
      </div>
      <div class="rate-limit" id="rateLimitInfo">Rate limit: not yet checked</div>
    </div>
    <div class="modal-footer">
      <button onclick="saveSettings()" class="btn-primary">Save</button>
    </div>
  </div>
</div>

<!-- Reader Mode -->
<div class="reader-overlay" id="readerMode">
  <div class="reader-header">
    <h3>📖 Reader Mode</h3>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="reader-toc-toggle" onclick="toggleReaderToc()">📑 Contents</button>
      <button onclick="closeReader()" class="reader-close">✕ Close</button>
    </div>
  </div>
  <div class="reader-content">
    <div class="reader-toc" id="readerToc"></div>
    <div class="reader-body markdown-body" id="readerBody"></div>
  </div>
</div>

<!-- Header -->
<header>
  <span style="font-size:20px">📝</span>
  <h1>Markdown to HTML</h1>
  <div class="mode-select">
    <select id="renderMode" title="Rendering mode">
      <option value="markdown">Standard</option>
      <option value="gfm" selected>GFM</option>
    </select>
  </div>
  <div class="toolbar">
    <button onclick="openFilePicker()" title="Open Markdown file">📂<span class="btn-label"> Open</span></button>
    <button onclick="renderMarkdown()" id="convertBtn" title="Convert now">🔄<span class="btn-label"> Convert</span></button>
    <button onclick="openSettings()" title="Settings">⚙️</button>
    <button onclick="openReader()" title="Reader mode">📖</button>
    <button onclick="clearAll()" title="Clear">🗑️</button>
  </div>
</header>

<!-- Mobile toggle -->
<div class="mobile-tabs" id="mobileTabs">
  <button class="mobile-tab active" data-view="editor" onclick="setMobileView('editor')">✏️ Editor</button>
  <button class="mobile-tab" data-view="output" onclick="setMobileView('output')">👁️ Preview</button>
</div>

<!-- Main content -->
<div class="container">
  <div class="panel editor-panel" id="editorPanel">
    <div class="panel-header">
      <span>Markdown Input</span>
      <span class="file-chip" id="fileChip" style="display:none"></span>
      <span class="status" id="status"></span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Type or paste Markdown here…  (or drop a .md file / use 📂 Open)"></textarea>
  </div>

  <div class="panel output-panel" id="outputPanel">
    <div class="panel-header">
      <span class="tab active" data-view="preview" onclick="switchView('preview')">Preview</span>
      <span class="tab" data-view="toc" onclick="switchView('toc')">TOC</span>
      <span class="tab" data-view="html" onclick="switchView('html')">HTML</span>
      <div class="panel-actions">
        <button onclick="copyHTML()" title="Copy HTML to clipboard">📋 Copy</button>
        <button onclick="downloadHTML()" title="Download as HTML file">⬇️ Download</button>
      </div>
    </div>
    <div id="preview" class="markdown-body panel-content"></div>
    <div id="toc" class="panel-content" style="display:none"></div>
    <div id="htmlOutput" class="panel-content" style="display:none"></div>
  </div>
</div>

<!-- Hidden fallback file input (browsers without the File System Access API) -->
<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" style="display:none">

<!-- Drag & drop overlay -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-msg">📂 Drop your Markdown file to open</div>
</div>

<div class="toast" id="toast"></div>

<script>
  // State
  let currentView = 'preview';
  let renderedHTML = '';
  let debounceTimer = null;
  let rateLimit = { remaining: '--', limit: '--', reset: '--' };
  let tocHeadings = [];

  // Linked-file / live-watch state
  let fileHandle = null;        // FileSystemFileHandle when opened via the File System Access API
  let watchTimer = null;        // setInterval id polling the file on disk
  let linkedFileName = '';      // display name of the linked file
  let lastDiskContent = '';     // content as last read from disk (to detect local edits)
  let lastDiskModified = 0;     // file.lastModified of the last disk read
  let pendingDiskContent = null; // disk content awaiting user confirmation (local edits diverged)

  // DOM refs
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const htmlOutput = document.getElementById('htmlOutput');
  const tocEl = document.getElementById('toc');
  const statusEl = document.getElementById('status');

  // Settings
  function loadSettings() {
    const cleanup = JSON.parse(localStorage.getItem('gh_md_cleanup') || '{}');
    document.getElementById('cleanupAnchors').checked = cleanup.anchors !== false;
    document.getElementById('cleanupPrefixes').checked = cleanup.prefixes !== false;
    document.getElementById('cleanupDataAttrs').checked = cleanup.dataAttrs !== false;
  }

  function saveSettings() {
    localStorage.setItem('gh_md_cleanup', JSON.stringify({
      anchors: document.getElementById('cleanupAnchors').checked,
      prefixes: document.getElementById('cleanupPrefixes').checked,
      dataAttrs: document.getElementById('cleanupDataAttrs').checked
    }));
    closeSettings();
    showToast('Settings saved');
    if (editor.value.trim()) renderMarkdown();
  }

  function openSettings() { document.getElementById('settingsModal').classList.add('active'); }
  function closeSettings() { document.getElementById('settingsModal').classList.remove('active'); }

  // GitHub Markdown API
  async function renderMarkdown() {
    const text = editor.value;
    if (!text.trim()) {
      renderedHTML = '';
      preview.innerHTML = '<p class="placeholder-msg">Start typing Markdown to see the preview…</p>';
      htmlOutput.textContent = '';
      tocEl.innerHTML = '';
      statusEl.textContent = '';
      refreshReaderIfOpen();
      return;
    }

    const mode = document.getElementById('renderMode').value;

    statusEl.textContent = '⏳ Rendering…';
    document.getElementById('convertBtn').disabled = true;

    try {
      const headers = { 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' };

      const response = await fetch('https://api.github.com/markdown', {
        method: 'POST',
        headers,
        body: JSON.stringify({ text, mode })
      });

      // Update rate limit from response headers
      const rlRemaining = response.headers.get('x-ratelimit-remaining');
      const rlLimit = response.headers.get('x-ratelimit-limit');
      const rlReset = response.headers.get('x-ratelimit-reset');
      if (rlRemaining !== null) {
        rateLimit = { remaining: rlRemaining, limit: rlLimit || '--', reset: rlReset || '--' };
        updateRateLimitDisplay();
      }

      if (!response.ok) {
        if (response.status === 403 || response.status === 429) {
          throw new Error('Rate limited — try again later (60 requests/hr)');
        }
        throw new Error(`API error: ${response.status}`);
      }

      let html = await response.text();
      html = cleanupHTML(html);
      renderedHTML = html;

      preview.innerHTML = html;
      htmlOutput.textContent = html;
      buildTOC(html);
      refreshReaderIfOpen();

      statusEl.textContent = `✅ ${rateLimit.remaining}/${rateLimit.limit} left`;
    } catch (error) {
      statusEl.textContent = `❌ ${error.message}`;
    } finally {
      document.getElementById('convertBtn').disabled = false;
    }
  }

  // Cleanup GitHub-specific artifacts
  function cleanupHTML(html) {
    const cleanup = JSON.parse(localStorage.getItem('gh_md_cleanup') || '{}');
    if (cleanup.anchors !== false) {
      html = html.replace(/<a[^>]*class="anchor"[^>]*>[\s\S]*?<\/a>/gi, '');
    }
    if (cleanup.prefixes !== false) {
      html = html.replace(/id="user-content-/g, 'id="');
      html = html.replace(/href="#user-content-/g, 'href="#');
    }
    if (cleanup.dataAttrs !== false) {
      html = html.replace(/\s+data-[a-z-]+="[^"]*"/gi, '');
    }
    return html;
  }

  // Build table of contents from rendered HTML
  function buildTOC(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const headings = doc.querySelectorAll('h1, h2, h3, h4, h5, h6');

    if (headings.length === 0) {
      tocEl.innerHTML = '<p class="toc-empty">No headings found. Add headings (# Title) to generate a table of contents.</p>';
      return;
    }

    const minLevel = Math.min(...Array.from(headings).map(h => parseInt(h.tagName[1])));
    let tocHTML = '<h3>📑 Table of Contents</h3><ul>';
    let prevLevel = minLevel;
    tocHeadings = [];

    headings.forEach(h => {
      const level = parseInt(h.tagName[1]);
      const text = h.textContent.trim();
      const id = h.id || text.toLowerCase().replace(/[^\w]+/g, '-').replace(/(^-|-$)/g, '');
      const idx = tocHeadings.length;
      tocHeadings.push({ level, text, id });
      if (level > prevLevel) tocHTML += '<ul>'.repeat(level - prevLevel);
      else if (level < prevLevel) tocHTML += '</ul>'.repeat(prevLevel - level);
      tocHTML += `<li><a href="#${id}" onclick="event.preventDefault(); navigateToHeading(${idx});">${text}</a></li>`;
      prevLevel = level;
    });
    tocHTML += '</ul>'.repeat(prevLevel - minLevel + 1);
    tocEl.innerHTML = tocHTML;
  }

  // View switching
  function switchView(view) {
    currentView = view;
    document.querySelectorAll('.output-panel .tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    preview.style.display = view === 'preview' ? 'block' : 'none';
    tocEl.style.display = view === 'toc' ? 'block' : 'none';
    htmlOutput.style.display = view === 'html' ? 'block' : 'none';
  }

  // Mobile view toggle
  function setMobileView(view) {
    document.querySelectorAll('.mobile-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    document.getElementById('editorPanel').classList.toggle('mobile-hidden', view !== 'editor');
    document.getElementById('outputPanel').classList.toggle('mobile-hidden', view !== 'output');
  }

  // Reader mode
  function openReader() {
    if (!renderedHTML) { showToast('Nothing to read — convert some Markdown first'); return; }
    document.getElementById('readerBody').innerHTML = renderedHTML;
    buildReaderTOC();
    const toc = document.getElementById('readerToc');
    toc.classList.remove('collapsed', 'show');
    document.getElementById('readerMode').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  // Keep the Reader Mode overlay in sync with the latest render while it is open.
  // Preserves scroll position so live updates (typing or disk reloads) aren't jarring.
  function refreshReaderIfOpen() {
    const readerMode = document.getElementById('readerMode');
    if (!readerMode.classList.contains('active')) return;
    const body = document.getElementById('readerBody');
    const prevScroll = body.scrollTop;
    body.innerHTML = renderedHTML;
    buildReaderTOC();
    body.scrollTop = prevScroll;
  }

  function closeReader() {
    document.getElementById('readerMode').classList.remove('active');
    document.body.style.overflow = '';
  }

  function buildReaderTOC() {
    const parser = new DOMParser();
    const doc = parser.parseFromString(renderedHTML, 'text/html');
    const headings = doc.querySelectorAll('h1, h2, h3, h4, h5, h6');
    const readerToc = document.getElementById('readerToc');
    if (!headings.length) { readerToc.innerHTML = ''; return; }
    let html = '<h4>Contents</h4><ul>';
    headings.forEach(h => {
      const id = h.id || '';
      const tag = h.tagName.toLowerCase();
      html += `<li class="toc-${tag}"><a href="#${id}" onclick="event.preventDefault(); scrollToHeading('readerBody', '${id}'); if(window.matchMedia('(max-width:768px)').matches) document.getElementById('readerToc').classList.remove('show');">${h.textContent.trim()}</a></li>`;
    });
    html += '</ul>';
    readerToc.innerHTML = html;
  }

  function toggleReaderToc() {
    const toc = document.getElementById('readerToc');
    if (window.matchMedia('(max-width: 768px)').matches) {
      toc.classList.toggle('show');
    } else {
      toc.classList.toggle('collapsed');
    }
  }

  // Copy HTML
  function copyHTML() {
    if (!renderedHTML) { showToast('Nothing to copy — convert some Markdown first'); return; }
    navigator.clipboard.writeText(renderedHTML).then(() => {
      showToast('✅ HTML copied to clipboard!');
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = renderedHTML;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✅ HTML copied to clipboard!');
    });
  }

  // Download HTML file
  function downloadHTML() {
    if (!renderedHTML) { showToast('Nothing to download — convert some Markdown first'); return; }
    const fullHTML = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Output</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
  <style>
    body { max-width: 800px; margin: 40px auto; padding: 20px; }
    .markdown-body { font-size: 16px; line-height: 1.8; }
  </style>
</head>
<body class="markdown-body">
${renderedHTML}
</body>
</html>`;
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'markdown-output.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('⬇️ HTML file downloaded!');
  }

  // Clear
  function clearAll() {
    editor.value = '';
    renderedHTML = '';
    preview.innerHTML = '';
    htmlOutput.textContent = '';
    tocEl.innerHTML = '';
    statusEl.textContent = '';
    unlinkFile();
  }

  // ---- File open / drag-drop / live-watch ----

  // Open via the File System Access API when available (enables live-watch),
  // otherwise fall back to a classic hidden <input type="file"> (load-once).
  async function openFilePicker() {
    if (window.showOpenFilePicker) {
      try {
        // Read-only by design: no `mode: 'readwrite'` is requested, so the tool
        // can only ever read the file — editor edits are never written back.
        const [handle] = await window.showOpenFilePicker({
          types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.mkd'], 'text/plain': ['.txt'] } }],
          excludeAcceptAllOption: false,
          multiple: false
        });
        await loadFromHandle(handle);
      } catch (err) {
        if (err && err.name !== 'AbortError') showToast('❌ Could not open file');
      }
    } else {
      document.getElementById('fileInput').click();
    }
  }

  // Load from a FileSystemFileHandle and begin watching it for external changes.
  async function loadFromHandle(handle) {
    try {
      const file = await handle.getFile();
      fileHandle = handle;
      await loadFromFile(file, handle);
      startWatching();
    } catch (err) {
      showToast('❌ Could not read file');
    }
  }

  // Populate the editor from a File object and render. `handle` is null on the
  // fallback path (no live-watch possible).
  async function loadFromFile(file, handle) {
    const text = await file.text();
    editor.value = text;
    linkedFileName = file.name;
    lastDiskContent = text;
    lastDiskModified = file.lastModified || Date.now();
    pendingDiskContent = null;
    updateFileChip();
    renderMarkdown();
    if (!handle && window.showOpenFilePicker === undefined) {
      showToast('📂 Loaded “' + file.name + '” (live-watch needs Chrome/Edge)');
    } else {
      showToast('📂 Opened “' + file.name + '”');
    }
  }

  // Poll the linked file ~1s and reload when its on-disk content changes.
  function startWatching() {
    stopWatching(false);
    if (!fileHandle) return;
    watchTimer = setInterval(async () => {
      if (!fileHandle) return;
      try {
        const file = await fileHandle.getFile();
        if (file.lastModified === lastDiskModified) return;
        const text = await file.text();
        onDiskChanged(text, file.lastModified);
      } catch (err) {
        // File removed / permission lost — stop watching quietly.
        stopWatching(true);
      }
    }, 1000);
    updateFileChip();
  }

  function stopWatching(updateChip) {
    if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
    if (updateChip) updateFileChip();
  }

  // Fully detach from the linked file.
  function unlinkFile() {
    stopWatching(false);
    fileHandle = null;
    linkedFileName = '';
    lastDiskContent = '';
    lastDiskModified = 0;
    pendingDiskContent = null;
    updateFileChip();
  }

  // Called when the watched file changed on disk.
  function onDiskChanged(text, modified) {
    lastDiskModified = modified;
    if (editor.value === lastDiskContent) {
      // No un-saved in-tool edits — safe to reload silently (the sync behavior).
      editor.value = text;
      lastDiskContent = text;
      pendingDiskContent = null;
      updateFileChip();
      renderMarkdown();
      statusEl.textContent = '🔄 Reloaded from disk';
    } else {
      // Local edits diverged — don't clobber; offer a manual reload instead.
      pendingDiskContent = text;
      updateFileChip();
      showToast('⚠️ “' + linkedFileName + '” changed on disk — click ⟳ to reload');
    }
  }

  // Apply a pending disk change after the user confirms (overwrites local edits).
  function reloadPending() {
    if (pendingDiskContent === null) return;
    editor.value = pendingDiskContent;
    lastDiskContent = pendingDiskContent;
    pendingDiskContent = null;
    updateFileChip();
    renderMarkdown();
    statusEl.textContent = '🔄 Reloaded from disk';
  }

  // Render the linked-file chip (filename, watch/reload indicators, unlink).
  function updateFileChip() {
    const chip = document.getElementById('fileChip');
    if (!linkedFileName) {
      chip.style.display = 'none';
      chip.innerHTML = '';
      return;
    }
    const watching = !!watchTimer;
    const name = linkedFileName.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // The opened file is always read-only — editor edits are never written back.
    let html = '<span class="file-readonly" title="Read-only — edits in the editor are never saved to this file">🔒</span>';
    if (pendingDiskContent !== null) {
      html += '<button class="file-reload" title="File changed on disk — reload" onclick="reloadPending()">⟳ Reload</button>';
    } else if (watching) {
      html += '<span class="file-watch" title="Watching file for changes">👁</span>';
    }
    html += '<span class="file-name" title="' + name + '">' + name + '</span>';
    html += '<button class="file-unlink" title="Stop using this file" onclick="unlinkFile()">✕</button>';
    chip.innerHTML = html;
    chip.style.display = 'inline-flex';
  }

  // Fallback file input
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) loadFromFile(file, null);
    e.target.value = ''; // allow re-selecting the same file
  });

  // Drag & drop anywhere on the window
  const dropOverlay = document.getElementById('dropOverlay');
  let dragDepth = 0;
  function hasFiles(e) {
    return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  }
  window.addEventListener('dragenter', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth++;
    dropOverlay.classList.add('active');
  });
  window.addEventListener('dragover', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dropOverlay.classList.add('active');
  });
  window.addEventListener('dragleave', (e) => {
    if (!hasFiles(e)) return;
    dragDepth--;
    if (dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('active'); }
  });
  window.addEventListener('drop', async (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove('active');
    // Prefer a real handle (enables live-watch) when the browser supports it.
    const item = e.dataTransfer.items && e.dataTransfer.items[0];
    if (item && item.getAsFileSystemHandle) {
      try {
        const handle = await item.getAsFileSystemHandle();
        if (handle && handle.kind === 'file') { await loadFromHandle(handle); return; }
      } catch (err) { /* fall through to plain file read */ }
    }
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) loadFromFile(file, null);
  });

  // Utility
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function scrollToHeading(containerId, headingId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const target = container.querySelector('[id="' + CSS.escape(headingId) + '"]');
    if (!target) return;
    const containerRect = container.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();
    const scrollOffset = targetRect.top - containerRect.top + container.scrollTop;
    container.scrollTo({ top: Math.max(0, scrollOffset - container.clientHeight / 3), behavior: 'smooth' });
  }

  function scrollEditorToHeading(level, text) {
    const prefix = '#'.repeat(level) + ' ';
    const lines = editor.value.split('\n');
    let charPos = 0;
    for (let i = 0; i < lines.length; i++) {
      const trimmed = lines[i].trimStart();
      if (trimmed.startsWith(prefix) && trimmed.substring(prefix.length).trim() === text) {
        editor.focus();
        editor.selectionStart = editor.selectionEnd = charPos;
        const lineHeight = parseFloat(getComputedStyle(editor).lineHeight);
        editor.scrollTop = Math.max(0, i * lineHeight - editor.clientHeight / 2);
        return;
      }
      charPos += lines[i].length + 1;
    }
  }

  function navigateToHeading(index) {
    const h = tocHeadings[index];
    if (!h) return;
    scrollEditorToHeading(h.level, h.text);
    switchView('preview');
    requestAnimationFrame(() => requestAnimationFrame(() => scrollToHeading('preview', h.id)));
  }

  function syncEditorToPreview() {
    if (currentView !== 'preview' || !renderedHTML) return;
    const previewEl = document.getElementById('preview');
    if (!previewEl || previewEl.scrollHeight <= previewEl.clientHeight) return;
    const text = editor.value;
    const lines = text.split('\n');
    if (lines.length <= 1) return;
    const cursorLine = text.substring(0, editor.selectionStart).split('\n').length - 1;

    // Find headings in editor source
    const editorHeadings = [];
    lines.forEach((line, i) => {
      const match = line.match(/^(#{1,6})\s+(.+)/);
      if (match) editorHeadings.push({ line: i, text: match[2].trim() });
    });

    const previewHeadings = previewEl.querySelectorAll('h1, h2, h3, h4, h5, h6');

    if (editorHeadings.length === 0 || previewHeadings.length === 0) {
      const ratio = cursorLine / (lines.length - 1);
      previewEl.scrollTo({ top: ratio * (previewEl.scrollHeight - previewEl.clientHeight), behavior: 'smooth' });
      return;
    }

    // Find heading just before cursor
    let prevIdx = -1;
    for (let i = editorHeadings.length - 1; i >= 0; i--) {
      if (editorHeadings[i].line <= cursorLine) { prevIdx = i; break; }
    }

    const previewRect = previewEl.getBoundingClientRect();

    function headingScrollPos(heading) {
      const headingRect = heading.getBoundingClientRect();
      return headingRect.top - previewRect.top + previewEl.scrollTop;
    }

    if (prevIdx === -1) {
      // Before first heading
      const firstLine = editorHeadings[0].line;
      const ratio = firstLine > 0 ? cursorLine / firstLine : 0;
      const targetTop = ratio * headingScrollPos(previewHeadings[0]);
      previewEl.scrollTo({ top: targetTop, behavior: 'smooth' });
      return;
    }

    const pIdx = Math.min(prevIdx, previewHeadings.length - 1);
    let scrollTarget = headingScrollPos(previewHeadings[pIdx]);

    // Interpolate between current and next heading
    const nextEditor = editorHeadings[prevIdx + 1];
    const nextPreview = previewHeadings[pIdx + 1];
    if (nextEditor && nextPreview) {
      const editorRange = nextEditor.line - editorHeadings[prevIdx].line;
      const progress = editorRange > 0 ? (cursorLine - editorHeadings[prevIdx].line) / editorRange : 0;
      scrollTarget += progress * (headingScrollPos(nextPreview) - headingScrollPos(previewHeadings[pIdx]));
    }

    previewEl.scrollTo({ top: scrollTarget, behavior: 'smooth' });
  }

  function updateRateLimitDisplay() {
    const resetTime = rateLimit.reset !== '--' ? new Date(parseInt(rateLimit.reset) * 1000).toLocaleTimeString() : '--';
    document.getElementById('rateLimitInfo').textContent =
      `Rate limit: ${rateLimit.remaining}/${rateLimit.limit} remaining (resets at ${resetTime})`;
  }

  // Debounced auto-render on input
  editor.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    statusEl.textContent = '⏳ Waiting…';
    debounceTimer = setTimeout(renderMarkdown, 800);
  });

  // Tab key in editor
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = editor.selectionStart, end = editor.selectionEnd;
      editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = s + 2;
    }
  });

  // Editor-to-preview scroll sync
  editor.addEventListener('click', syncEditorToPreview);
  editor.addEventListener('keyup', (e) => {
    const navKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'PageUp', 'PageDown'];
    if (navKeys.includes(e.key)) syncEditorToPreview();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeSettings(); closeReader(); }
  });

  // Re-render on mode change
  document.getElementById('renderMode').addEventListener('change', () => {
    if (editor.value.trim()) renderMarkdown();
  });

  // Init
  loadSettings();
  editor.value = `# Markdown to HTML Converter

## Features

- Convert using **GitHub's official Markdown API**
- Choose between **Standard** and **GFM** rendering modes
- **Live preview** with auto-generated Table of Contents
- **Reader mode** for distraction-free reading
- **Copy** or **download** the rendered HTML
- Cleanup options to remove GitHub-specific artifacts

## Getting Started

1. Paste or type your Markdown in the editor
2. The preview updates automatically (800ms debounce)
3. Switch tabs to see the **Table of Contents** or **raw HTML**

### Code Example

\`\`\`javascript
function greet(name) {
  return \`Hello, \${name}!\`;
}
\`\`\`

### Task Lists (GFM)

- [x] Live preview
- [x] Table of contents
- [x] Copy to clipboard
- [x] Download HTML file
- [x] Reader mode
- [ ] More features coming!

> 💡 **Tip:** Open **⚙️ Settings** to configure cleanup options for the generated HTML.
`;
  renderMarkdown();
</script>
</body>
</html>
