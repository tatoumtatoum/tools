<!DOCTYPE html>
<html lang="fr">
<head>

    }

      background: #fff3cd; border-bottom: 1px solid #ffc107;
      padding: .3rem 1rem; text-align: center; font-size: .8rem;

    }
    .app-navbar {

      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

      position: fixed; top: 0; bottom: 0; left: 0; width: var(--sidebar-w);
      padding-top: 110px; background: #fff; border-right: 1px solid #dee2e6;
      overflow-y: auto; z-index: 1010;
    }

    }

    }

// ========================================================================
// AUTH
// ========================================================================
function showLogin() {
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('app-shell').style.display = 'none';
}

function showApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  const roleLabel = currentUser.role === 'doctor' ? 'Docteur' : 'Assistante';
  const displayName = currentUser.role === 'doctor'
    ? `${currentUser.title} ${currentUser.firstName} ${currentUser.lastName}`
    : `${currentUser.firstName} ${currentUser.lastName}`;
  document.getElementById('user-display').innerHTML =
    `${displayName} <span class="badge bg-light text-dark">${roleLabel}</span>`;
  renderNavigation();
  handleRoute();
}

async function loginUser(username, password) {
  const user = await db.users.where('username').equals(username).first();
  if (user && user.password === password) {
    currentUser = user;
    sessionStorage.setItem('cabinetUser', JSON.stringify(user));
    return true;
  }
  return false;
}

function logoutUser() {
  currentUser = null;
  sessionStorage.removeItem('cabinetUser');
  location.hash = '';
  showLogin();
}

function isDoctor() { return currentUser && currentUser.role === 'doctor'; }

// ========================================================================
// NAVIGATION
// ========================================================================
function getNavItems() {
  const items = [
    { route: 'dashboard', icon: 'speedometer2', label: 'Tableau de bord' },
    { route: 'patients', icon: 'people', label: 'Patients' },
    { route: 'appointments', icon: 'calendar-event', label: 'Rendez-vous' }
  ];
  if (isDoctor()) {
    items.push(
      { route: 'consultations', icon: 'clipboard2-pulse', label: 'Consultations' },
      { route: 'prescriptions', icon: 'file-earmark-medical', label: 'Ordonnances' },
      { route: 'reports', icon: 'journal-medical', label: 'Comptes-rendus' },
      { route: 'feuilles', icon: 'receipt', label: 'Feuilles de soin' }
    );
  }
  return items;
}

function renderNavigation() {
  const html = getNavItems().map(i => `
    <a class="nav-link" href="#/${i.route}" data-route="${i.route}">
      <i class="bi bi-${i.icon}"></i> ${i.label}
    </a>`).join('');
  document.getElementById('desktop-nav').innerHTML = html;
  document.getElementById('mobile-nav').innerHTML = html;
  // Update mobile user info
  const mobileInfo = document.getElementById('mobile-user-info');
  if (mobileInfo && currentUser) {
    const roleLabel = currentUser.role === 'doctor' ? 'Médecin' : 'Assistante';
    mobileInfo.innerHTML = `<i class="bi bi-person-circle me-1"></i> ${currentUser.fullName} <span class="text-muted">— ${roleLabel}</span>`;
  }
}

function updateSidebarActive(route) {
  document.querySelectorAll('#desktop-nav .nav-link, #mobile-nav .nav-link').forEach(el => {
    el.classList.toggle('active', el.dataset.route === route);
  });
}

// ========================================================================
// ROUTER
// ========================================================================
function getRoute() {
  const hash = location.hash.slice(1) || '/dashboard';
  const [pathPart, queryPart] = hash.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const query = queryPart ? Object.fromEntries(new URLSearchParams(queryPart)) : {};
  return { section: parts[0] || 'dashboard', param: parts[1] || null, action: parts[2] || null, query };
}

async function handleRoute() {
  if (!currentUser) { showLogin(); return; }
  const route = getRoute();
  if (DOCTOR_ROUTES.includes(route.section) && !isDoctor()) {
    location.hash = '#/dashboard';
    return;
  }
  updateSidebarActive(route.section);
  const mc = document.getElementById('main-content');

  switch (route.section) {
    case 'dashboard': await viewDashboard(mc); break;
    case 'patients':
      if (route.param === 'new') await viewPatientForm(mc);
      else if (route.action === 'edit') await viewPatientForm(mc, parseInt(route.param));
      else if (route.param) await viewPatientDetail(mc, parseInt(route.param));
      else await viewPatients(mc);
      break;
    case 'appointments':
      if (route.param === 'new') await viewAppointmentForm(mc, null, route.query);
      else if (route.action === 'edit') await viewAppointmentForm(mc, parseInt(route.param));
      else await viewAppointments(mc);
      break;
    case 'consultations':
      if (route.param === 'new') await viewConsultationForm(mc, null, route.query);
      else if (route.action === 'edit') await viewConsultationForm(mc, parseInt(route.param));
      else if (route.param) await viewConsultationDetail(mc, parseInt(route.param));
      else await viewConsultations(mc);
      break;
    case 'prescriptions':
      if (route.param === 'new') await viewPrescriptionForm(mc, null, route.query);
      else if (route.action === 'edit') await viewPrescriptionForm(mc, parseInt(route.param));
      else if (route.param) await viewPrescriptionDetail(mc, parseInt(route.param));
      else await viewPrescriptions(mc);
      break;
    case 'reports':
      if (route.param === 'new') await viewReportForm(mc, null, route.query);
      else if (route.action === 'edit') await viewReportForm(mc, parseInt(route.param));
      else if (route.param) await viewReportDetail(mc, parseInt(route.param));
      else await viewReports(mc);
      break;
    case 'feuilles':
      if (route.param === 'new') await viewFeuilleForm(mc, null, route.query);
      else if (route.action === 'edit') await viewFeuilleForm(mc, parseInt(route.param));
      else if (route.param) await viewFeuilleDetail(mc, parseInt(route.param));
      else await viewFeuilles(mc);
      break;
    default: mc.innerHTML = '<h2>Page non trouvée</h2>';
  }

  // Close mobile sidebar on navigation
  const offcanvasEl = document.getElementById('mobileSidebar');
  const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
  if (offcanvas) offcanvas.hide();
}

window.addEventListener('hashchange', handleRoute);

// ========================================================================
// UTILITIES
// ========================================================================
function fmtDate(d) { return d ? dayjs(d).format('DD/MM/YYYY') : '—'; }
function fmtDateTime(d, t) { return `${fmtDate(d)} ${t || ''}`; }
function fmtMoney(n) { return parseFloat(n).toFixed(2) + ' €'; }
async function getPatientName(id) {
  const p = await db.patients.get(id);
  return p ? `${p.lastName} ${p.firstName}` : 'Inconnu';
}
async function patientOptions(selectedId) {
  const patients = await db.patients.orderBy('lastName').toArray();
  return patients.map(p =>
    `<option value="${p.id}" ${p.id === selectedId ? 'selected' : ''}>${p.lastName} ${p.firstName}</option>`
  ).join('');
}

function statusBadge(status) {
  const colors = { 'Planifié': 'primary', 'Confirmé': 'info', 'Terminé': 'success', 'Annulé': 'secondary',
    'Active': 'success', 'Terminée': 'secondary', 'Brouillon': 'warning', 'Finalisé': 'success',
    'En cours': 'primary', 'Envoyée': 'info', 'Remboursée': 'success' };
  return `<span class="badge bg-${colors[status] || 'dark'}">${status}</span>`;
}

function consultationLink(consultationId) {
  if (!consultationId) return '<span class="text-muted small">—</span>';
  return `<a href="#/consultations/${consultationId}" class="badge bg-light text-primary text-decoration-none" title="Voir la consultation"><i class="bi bi-clipboard2-pulse"></i> Consultation #${consultationId}</a>`;
}

async function getConsultationOptions(selectedId, patientId) {
  let consults;
  if (patientId) consults = await db.consultations.where('patientId').equals(patientId).reverse().sortBy('date');
  else consults = await db.consultations.reverse().sortBy('date');
  const items = [];
  for (const c of consults) {
    const pName = await getPatientName(c.patientId);
    items.push(`<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${fmtDate(c.date)} — ${pName} — ${c.motif}</option>`);
  }
  return items.join('');
}

function confirmAction(message, callback) {
  document.getElementById('confirmModalBody').textContent = message;
  const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
  const btn = document.getElementById('confirmModalAction');
  const handler = async () => { btn.removeEventListener('click', handler); modal.hide(); await callback(); };
  btn.addEventListener('click', handler);
  modal.show();
}

function viewHeader(title, actions) {
  return `<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 id="view-title" class="mb-0">${title}</h2>
    <div>${actions || ''}</div></div>`;
}

async function viewDashboard(mc) {
  const patientCount = await db.patients.count();
  const today = dayjs().format('YYYY-MM-DD');
  const todayAppts = await db.appointments.where('date').equals(today).toArray();
  const weekStart = dayjs().startOf('week').format('YYYY-MM-DD');
  const weekEnd = dayjs().endOf('week').format('YYYY-MM-DD');

  let consultWeek = 0;
  if (isDoctor()) {
    const allConsults = await db.consultations.toArray();
    consultWeek = allConsults.filter(c => c.date >= weekStart && c.date <= weekEnd).length;
  }

  // Enrich today's appointments with patient names
  for (const a of todayAppts) { a._patientName = await getPatientName(a.patientId); }
  todayAppts.sort((a, b) => a.startTime.localeCompare(b.startTime));

  mc.innerHTML = viewHeader('Tableau de bord') + `
    <div class="row g-3 mb-4">
      <div class="col-sm-4"><div class="card stat-card p-3">
        <div class="text-muted small">Patients</div><div class="stat-value">${patientCount}</div>
      </div></div>
      <div class="col-sm-4"><div class="card stat-card p-3">
        <div class="text-muted small">RDV aujourd'hui</div><div class="stat-value">${todayAppts.length}</div>
      </div></div>
      ${isDoctor() ? `<div class="col-sm-4"><div class="card stat-card p-3">
        <div class="text-muted small">Consultations (semaine)</div><div class="stat-value">${consultWeek}</div>
      </div></div>` : `<div class="col-sm-4"><div class="card stat-card p-3">
        <div class="text-muted small">Prochain RDV</div><div class="stat-value">${todayAppts.length > 0 ? todayAppts[0].startTime : '—'}</div>
      </div></div>`}
    </div>
    <div class="card"><div class="card-header"><h5 class="mb-0"><i class="bi bi-calendar-day"></i> Rendez-vous du jour</h5></div>
      <div class="card-body p-0"><div class="table-responsive">
        <table class="table table-hover mb-0"><thead><tr><th>Heure</th><th>Patient</th><th>Type</th><th>Statut</th></tr></thead>
        <tbody>${todayAppts.length === 0 ? '<tr><td colspan="4" class="text-center text-muted py-3">Aucun rendez-vous aujourd\'hui</td></tr>' :
          todayAppts.map(a => `<tr>
            <td>${a.startTime} - ${a.endTime}</td>
            <td><a href="#/patients/${a.patientId}">${a._patientName}</a></td>
            <td>${a.type}</td><td>${statusBadge(a.status)}</td>
          </tr>`).join('')}
        </tbody></table></div></div></div>`;
}

          ${isDoctor() ? `<td class="d-none d-md-table-cell">${a._consultationId
            ? `<a href="#/consultations/${a._consultationId}" class="badge bg-success text-decoration-none"><i class="bi bi-check-circle"></i> #${a._consultationId}</a>`
            : `<a href="#/consultations/new?patientId=${a.patientId}&appointmentId=${a.id}" class="badge bg-outline-primary border text-primary text-decoration-none"><i class="bi bi-plus-circle"></i> Créer</a>`}</td>` : ''}

            <a href="#/appointments/${a.id}/edit" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
            <button onclick="deleteAppointment(${a.id})" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
          </td></tr>`).join('')}
      </tbody></table></div></div></div>`;

  document.getElementById('appt-filter').addEventListener('change', function() {
    const today = dayjs().format('YYYY-MM-DD');
    const weekEnd = dayjs().endOf('week').format('YYYY-MM-DD');
    document.querySelectorAll('#appointments-table tbody tr').forEach(tr => {
      const d = tr.dataset.date;
      let show = true;
      if (this.value === 'today') show = d === today;
      else if (this.value === 'week') show = d >= today && d <= weekEnd;
      else if (this.value === 'upcoming') show = d >= today;
      tr.style.display = show ? '' : 'none';
    });
  });
}

async function viewPrescriptionForm(mc, id, query) {
  const p = id ? await db.prescriptions.get(id) : {};
  const title = id ? 'Modifier l\'ordonnance' : 'Nouvelle ordonnance';
  const selectedPatientId = p.patientId || parseInt(query?.patientId) || null;
  const opts = await patientOptions(selectedPatientId);
  const meds = p.medications ? JSON.parse(p.medications) : [];
  const selectedConsultId = p.consultationId || parseInt(query?.consultationId) || null;
  const consultOpts = await getConsultationOptions(selectedConsultId, selectedPatientId);

  mc.innerHTML = viewHeader(title, `<a href="#/prescriptions" class="btn btn-outline-secondary btn-sm">Retour</a>`) + `
    <div class="card"><div class="card-body"><form id="prescription-form">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Patient *</label>
          <select class="form-select" id="prf-patientId" required><option value="">Sélectionner...</option>${opts}</select></div>
        <div class="col-md-6"><label class="form-label">Consultation associée</label>
          <select class="form-select" id="prf-consultationId"><option value="">Aucune</option>${consultOpts}</select></div>
        <div class="col-md-6"><label class="form-label">Date</label>
          <input type="date" class="form-control" id="prf-date" value="${p.date || dayjs().format('YYYY-MM-DD')}"></div>
        <div class="col-md-6"><label class="form-label">Statut</label>
          <select class="form-select" id="prf-status">
            ${['Active','Terminée'].map(s => `<option ${p.status===s?'selected':''}>${s}</option>`).join('')}
          </select></div>
      </div>
      <h6 class="mt-3 mb-2">Médicaments</h6>
      <div id="medications-container">
        ${meds.map((m, i) => medicationRowHTML(m)).join('')}
      </div>
      <button type="button" id="add-medication-btn" class="btn btn-sm btn-outline-primary mt-2"><i class="bi bi-plus"></i> Ajouter un médicament</button>
      <div class="mt-3"><label class="form-label">Notes</label>
        <textarea class="form-control" id="prf-notes" rows="2">${p.notes || ''}</textarea></div>
      <div class="mt-3"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Enregistrer</button></div>
    </form></div></div>`;

  document.getElementById('add-medication-btn').addEventListener('click', () => {
    document.getElementById('medications-container').insertAdjacentHTML('beforeend', medicationRowHTML({}));
  });

  document.getElementById('prescription-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const medications = collectMedications();
    const data = {
      patientId: parseInt(document.getElementById('prf-patientId').value),
      consultationId: parseInt(document.getElementById('prf-consultationId').value) || null,
      doctorId: currentUser.id, date: document.getElementById('prf-date').value,
      medications: JSON.stringify(medications),
      notes: document.getElementById('prf-notes').value,
      status: document.getElementById('prf-status').value
    };
    if (id) { await db.prescriptions.update(id, data); }
    else { data.createdAt = new Date().toISOString(); await db.prescriptions.add(data); }
    location.hash = '#/prescriptions';
  });
}

function medicationRowHTML(m) {
  return `<div class="medication-row border rounded p-2 mb-2">
    <div class="row g-2">
      <div class="col-md-3"><input type="text" class="form-control form-control-sm" data-field="name" placeholder="Médicament" value="${m.name || ''}"></div>
      <div class="col-md-2"><input type="text" class="form-control form-control-sm" data-field="dosage" placeholder="Posologie" value="${m.dosage || ''}"></div>
      <div class="col-md-2"><input type="text" class="form-control form-control-sm" data-field="frequency" placeholder="Fréquence" value="${m.frequency || ''}"></div>
      <div class="col-md-2"><input type="text" class="form-control form-control-sm" data-field="duration" placeholder="Durée" value="${m.duration || ''}"></div>
      <div class="col-md-2"><input type="text" class="form-control form-control-sm" data-field="instructions" placeholder="Instructions" value="${m.instructions || ''}"></div>
      <div class="col-md-1 d-flex align-items-end"><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.medication-row').remove()"><i class="bi bi-trash"></i></button></div>
    </div></div>`;
}

function collectMedications() {
  return Array.from(document.querySelectorAll('.medication-row')).map(row => ({
    name: row.querySelector('[data-field="name"]').value,
    dosage: row.querySelector('[data-field="dosage"]').value,
    frequency: row.querySelector('[data-field="frequency"]').value,
    duration: row.querySelector('[data-field="duration"]').value,
    instructions: row.querySelector('[data-field="instructions"]').value
  })).filter(m => m.name.trim());
}

function actRowHTML(a) {
  return `<div class="act-row border rounded p-2 mb-2"><div class="row g-2">
    <div class="col-md-3"><input type="text" class="form-control form-control-sm" data-field="code" placeholder="Code (ex: CS)" value="${a.code || ''}"></div>
    <div class="col-md-5"><input type="text" class="form-control form-control-sm" data-field="label" placeholder="Libellé" value="${a.label || ''}"></div>
    <div class="col-md-3"><input type="number" step="0.01" class="form-control form-control-sm act-amount" data-field="amount" placeholder="Montant €" value="${a.amount || ''}"></div>
    <div class="col-md-1 d-flex align-items-end"><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.act-row').remove(); updateActsTotal()"><i class="bi bi-trash"></i></button></div>
  </div></div>`;
}

function collectActs() {
  return Array.from(document.querySelectorAll('.act-row')).map(row => ({
    code: row.querySelector('[data-field="code"]').value,
    label: row.querySelector('[data-field="label"]').value,
    amount: parseFloat(row.querySelector('[data-field="amount"]').value) || 0
  })).filter(a => a.label.trim());
}

function updateActsTotal() {
  const total = Array.from(document.querySelectorAll('.act-amount'))
    .reduce((sum, el) => sum + (parseFloat(el.value) || 0), 0);
  const el = document.getElementById('acts-total');
  if (el) el.textContent = total.toFixed(2);
}

function bindActAmountListeners() {
  document.querySelectorAll('.act-amount').forEach(el => {
    el.removeEventListener('input', updateActsTotal);
    el.addEventListener('input', updateActsTotal);
  });
}

  doc.setFontSize(10);
  doc.text('Dr. Youssef Bennani — Medecin Generaliste', 20, 40);
  doc.text('Cabinet Medical — Demonstration', 20, 46);
  doc.line(20, 52, 190, 52);
  return 60;
}

function generatePatientPDF(patient) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = pdfHeader(doc, 'FICHE PATIENT');
  doc.setFontSize(12);
  doc.text(`${patient.lastName} ${patient.firstName}`, 20, y); y += 8;
  doc.setFontSize(10);
  const fields = [
    ['Date de naissance', fmtDate(patient.dateOfBirth)],
    ['Genre', patient.gender === 'M' ? 'Masculin' : 'Feminin'],
    ['Telephone', patient.phone || '—'],
    ['Email', patient.email || '—'],
    ['Adresse', [patient.address, patient.postalCode, patient.city].filter(Boolean).join(', ') || '—'],
    ['N. Secu', patient.numSecu || '—'],
    ['Groupe sanguin', patient.bloodType || '—'],
    ['Mutuelle', patient.mutuelle || '—'],
    ['Medecin traitant', patient.medecinTraitant || '—'],
    ['Allergies', patient.allergies || 'Aucune'],
    ['Antecedents', patient.antecedents || 'Aucun'],
    ['Notes', patient.notes || '—']
  ];
  fields.forEach(([label, value]) => {
    doc.text(`${label} : ${value}`, 20, y); y += 6;
  });
  doc.save(`patient_${patient.lastName}_${patient.firstName}.pdf`);
}

function generateConsultationPDF(consultation, patientName, vs) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = pdfHeader(doc, 'CONSULTATION');
  doc.text(`Patient : ${patientName}`, 20, y);
  doc.text(`Date : ${fmtDate(consultation.date)}`, 120, y); y += 8;
  doc.line(20, y, 190, y); y += 8;
  const sections = [
    ['Motif', consultation.motif],
    ['Symptomes', consultation.symptoms],
    ['Examen clinique', consultation.examenClinique],
    ['Diagnostic', consultation.diagnostic],
    ['Notes', consultation.notes]
  ];
  sections.forEach(([label, value]) => {
    if (value) {
      doc.setFontSize(11);
      doc.text(`${label} :`, 20, y); y += 6;
      doc.setFontSize(10);
      const lines = doc.splitTextToSize(value, 160);
      doc.text(lines, 25, y); y += lines.length * 5 + 4;
    }
  });
  if (vs && Object.values(vs).some(v => v)) {
    doc.setFontSize(11);
    doc.text('Signes vitaux :', 20, y); y += 6;
    doc.setFontSize(10);
    const vitals = [`Tension: ${vs.tension || '—'}`, `Pouls: ${vs.pouls || '—'}`, `T.: ${vs.temperature || '—'}C`, `Poids: ${vs.poids || '—'} kg`, `Taille: ${vs.taille || '—'} cm`];
    doc.text(vitals.join('   |   '), 25, y); y += 8;
  }
  doc.setFontSize(10);
  doc.text('Signature : Dr. Youssef Bennani', 130, 270);
  doc.save(`consultation_${patientName.replace(/\s+/g, '_')}_${dayjs(consultation.date).format('YYYYMMDD')}.pdf`);
}

function generateReportPDF(report, patient) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = pdfHeader(doc, report.type ? report.type.toUpperCase() : 'COMPTE-RENDU');
  doc.text(`Patient : ${patient.firstName} ${patient.lastName}`, 20, y);
  doc.text(`Date : ${fmtDate(report.date)}`, 120, y); y += 6;
  doc.text(`N. Secu : ${patient.numSecu || '—'}`, 20, y); y += 6;
  doc.line(20, y + 2, 190, y + 2); y += 10;
  doc.setFontSize(12);
  doc.text(report.title, 20, y); y += 8;
  doc.setFontSize(10);
  const lines = doc.splitTextToSize(report.content, 165);
  doc.text(lines, 20, y);
  doc.setFontSize(10);
  doc.text('Signature : Dr. Youssef Bennani', 130, 270);
  doc.save(`rapport_${patient.lastName}_${dayjs(report.date).format('YYYYMMDD')}.pdf`);
}

function generatePrescriptionPDF(prescription, patient) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica');
  doc.setFontSize(18);
  doc.text('ORDONNANCE', 105, 25, { align: 'center' });
  doc.setFontSize(10);
  doc.text('Dr. Youssef Bennani', 20, 40);
  doc.text('Medecin Generaliste', 20, 46);
  doc.text('Cabinet Medical - Demonstration', 20, 52);
  doc.line(20, 58, 190, 58);
  doc.text(`Patient : ${patient.firstName} ${patient.lastName}`, 20, 66);
  doc.text(`Date de naissance : ${fmtDate(patient.dateOfBirth)}`, 20, 72);
  doc.text(`N. Secu : ${patient.numSecu || '—'}`, 120, 66);
  doc.text(`Date : ${fmtDate(prescription.date)}`, 120, 72);
  doc.line(20, 78, 190, 78);

  const meds = JSON.parse(prescription.medications || '[]');
  let y = 88;
  meds.forEach((m, i) => {
    doc.setFontSize(11);
    doc.text(`${i + 1}. ${m.name}`, 25, y); y += 6;
    doc.setFontSize(9);
    if (m.dosage) { doc.text(`Posologie : ${m.dosage}`, 30, y); y += 5; }
    if (m.frequency) { doc.text(`Frequence : ${m.frequency}`, 30, y); y += 5; }
    if (m.duration) { doc.text(`Duree : ${m.duration}`, 30, y); y += 5; }
    if (m.instructions) { doc.text(`Instructions : ${m.instructions}`, 30, y); y += 5; }
    y += 4;
  });

  if (prescription.notes) {
    doc.setFontSize(9);
    doc.text(`Notes : ${prescription.notes}`, 20, y + 5);
  }

  doc.setFontSize(10);
  doc.text('Signature :', 130, 260);
  doc.text('Dr. Youssef Bennani', 130, 270);

  doc.save(`ordonnance_${patient.lastName}_${dayjs(prescription.date).format('YYYYMMDD')}.pdf`);
}

  doc.setFont('helvetica');
  doc.setFontSize(16);
  doc.text('FEUILLE DE SOINS', 105, 25, { align: 'center' });
  doc.setFontSize(10);
  doc.text('Dr. Youssef Bennani — Medecin Generaliste', 20, 40);
  doc.text(`Date : ${fmtDate(feuille.date)}`, 140, 40);
  doc.line(20, 46, 190, 46);
  doc.text(`Patient : ${patient.firstName} ${patient.lastName}`, 20, 54);
  doc.text(`N. Secu : ${patient.numSecu || '—'}`, 20, 60);
  doc.text(`Tiers payant : ${feuille.tiersPayant ? 'Oui' : 'Non'}`, 120, 54);
  doc.line(20, 66, 190, 66);

  const acts = JSON.parse(feuille.acts || '[]');
  let y = 76;
  doc.setFontSize(10);
  doc.text('Code', 25, y); doc.text('Acte', 55, y); doc.text('Montant', 165, y);
  y += 6; doc.line(20, y, 190, y); y += 6;
  acts.forEach(a => {
    doc.text(a.code, 25, y);
    doc.text(a.label, 55, y);
    doc.text(fmtMoney(a.amount), 165, y);
    y += 6;
  });
  doc.line(20, y, 190, y); y += 6;
  doc.setFontSize(11);
  doc.text(`Total : ${fmtMoney(feuille.totalAmount)}`, 140, y);

  doc.save(`feuille_${patient.lastName}_${dayjs(feuille.date).format('YYYYMMDD')}.pdf`);
}

// ========================================================================
// RESET DATABASE
// ========================================================================
window.resetDatabase = async function() {
  await db.delete();
  await db.open();
  await seedDatabase();
};

// ========================================================================
// INIT
// ========================================================================
async function init() {
  await seedDatabase();

  // Restore session
  const saved = sessionStorage.getItem('cabinetUser');
  if (saved) {
    const parsed = JSON.parse(saved);
    const user = await db.users.get(parsed.id);
    if (user) {
      currentUser = user;
      showApp();
    } else {
      showLogin();
    }
  } else {
    showLogin();
  }

  // Login form
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('login-username').value;
    const p = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    if (await loginUser(u, p)) {
      errorEl.classList.add('d-none');
      location.hash = '#/dashboard';
      showApp();
    } else {
      errorEl.textContent = 'Identifiants incorrects';
      errorEl.classList.remove('d-none');
    }
  });

  // Logout
  document.getElementById('logout-btn').addEventListener('click', logoutUser);

  // Reset data
  document.getElementById('reset-data-btn').addEventListener('click', async () => {
    await window.resetDatabase();
    location.hash = '#/dashboard';
    await handleRoute();
  });

  window.appReady = true;
}

init();
</script>
